const DB=[

{q:"Is there drinking water on site?",
 k:"water potable drink drinking tap bottle thirsty hydration well filter purification tablets refill fountain",
 conflict:"The handbook is out of date here. Follow the group answer.",
 guide:{t:"<p>Sections 4, 7 and 9 all state that tap water is <strong>not</strong> potable — that it comes from an untreated well, and that drinking it will make you sick. You're told to bring plenty of drinking water.</p>",
   stale:"Written before 3 August. The venue owner has since confirmed the opposite.",
   c:[{r:"GUIDE · §4 Venue Rules",t:"Tap water described as coming from an untreated well and not to be drunk."},
      {r:"GUIDE · §9 Food & Drink",t:"Repeats that tap water is not potable anywhere on site and advises bringing your own, with cold water for refills sold at the bar."}]},
 chat:{t:"<p><strong>Yes. Every tap in the festival area is potable city water.</strong> Any bar will refill your bottle. In the campground, the washing-up station outside the toilets and the sinks inside the bathrooms are drinkable too.</p><p>Bring a refillable bottle. You do not need to haul in a supply or buy purification tablets.</p>",
   c:[{r:"GROUP · 3 Aug · organiser side",t:"After pressing the venue owner, all sinks in the festival area carry potable city water; bars will refill bottles; the campground washing-up station and bathroom sinks are drinkable."},
      {r:"GROUP · 3 Aug · participant",t:"Bottled-water run called off following the announcement."}]}},

{q:"Do I need eclipse glasses?",
 k:"glasses eye eyes safety safe protection iso 12312 blind damage look sun filter sunglasses camera telescope binoculars kids",
 guide:{t:"<p><strong>Every participant receives one pair of ISO-certified eclipse glasses.</strong> You don't need to buy your own.</p><ul><li>Only use ISO-certified glasses — never look at the sun unprotected</li><li>Cameras, telescopes and binoculars need certified solar filters fitted</li></ul><p>The 19:00 safety talk on eclipse day covers how to view safely and how to use the telescope and binoculars.</p>",
   c:[{r:"GUIDE · §3 Packing — Eclipse Essentials",t:"Every participant will receive one pair of ISO-certified eclipse glasses; optional extras listed include a telescope, binoculars or camera fitted with a certified solar filter."},
      {r:"GUIDE · §10 Eclipse Day",t:"Instructions to use only ISO-certified glasses, never look directly at the sun without protection, and buy certified filters for optical equipment."}]},
 chat:{t:"<p>Nobody has raised eye protection in 519 messages. The organiser has a solar telescope and binoculars to share for the eclipse.</p><p>The handbook doesn't say where or when glasses are handed out — worth asking at the gate if you don't receive a pair.</p>",
   c:[{r:"GROUP · 3 Aug · organiser",t:"A solar telescope and binoculars will be shared for the eclipse."},
      {r:"CORPUS · absent",t:"No message in the export mentions eclipse glasses or eye safety."}]}},

{q:"What time is the eclipse?",
 k:"eclipse time totality when start begin partial maximum how long duration timing schedule dark ritual ceremony",
 conflict:"Two sets of figures are circulating. They differ by about two minutes.",
 guide:{t:"<p>Section 10 gives the eclipse-day timeline:</p><ul><li><strong>18:30</strong> — all music on site stops</li><li><strong>19:00</strong> — safety talk at the Celestial Stage. Bring something to sit on, water and snacks; plan for 2.5 hours</li><li><strong>19:15</strong> — Eclipse Ritual begins, meditation and offering</li><li><strong>19:30–20:30</strong> — Orlando Whales performs, interwoven with observation</li><li><strong>19:36</strong> — partial eclipse begins</li><li><strong>20:29</strong> — totality, 1 min 32 sec, sun 4° above the horizon</li><li><strong>20:31</strong> — sun crowns the 2.7° mountain peak</li><li><strong>20:35–20:45</strong> — final act, dissolving into ecstatic dance</li><li><strong>20:56</strong> — sun nears the horizon</li></ul>",
   c:[{r:"GUIDE · §10 Eclipse Day",t:"Full timeline from music stopping at 18:30 through totality at 20:29 to dusk at 20:56."}]},
 chat:{t:"<p>The figures posted in the group are slightly different: totality at <strong>20:31</strong>, lasting 1 min 33 sec, with the sun at 5° falling to 4.7° and the ridge at 3°.</p><p>The difference doesn't change anything that matters — totality clears the ridge either way — but if you're setting an alarm, be at the stage well before 20:29.</p>",
   c:[{r:"GROUP · 16 Jul · participant",t:"Site timings posted: partial start 19:36 at 15 degrees, totality 20:31 for 1m33s, partiality ending 20:55, ridge at 2.7 degrees."},
      {r:"GROUP · 2 Aug · organiser side",t:"Sun at 5 to 4.7 degrees during totality against a mountain peak at 3 degrees."}]}},

{q:"Will the mountain block the eclipse?",
 k:"mountain ridge block horizon view sightline totality visible altitude degrees sunset behind hill see clouds",
 guide:{t:"<p>Section 10 has the sun crowning the 2.7° mountain peak at 20:31, bathed in dusk's rainbow glow — so totality at 20:29 happens above the ridge.</p>",
   c:[{r:"GUIDE · §10 Eclipse Day",t:"Timeline entry for 20:31 describing the sun crowning the 2.7 degree mountain peak, following totality at 20:29 with the sun 4 degrees above the horizon."}]},
 chat:{t:"<p><strong>No. Totality clears the ridge.</strong> The sun holds 5° falling to 4.7° through totality; the ridge peaks at about 3°.</p><p>What you lose is the second half of the partial phase. Production checked the sun's position in April, at the same declination as mid-August, before booking the venue.</p>",
   c:[{r:"GROUP · 16 Jul · organiser",t:"Totality finishes and then the sun goes behind the mountain; position checked in April at the same solar position as mid-August, before booking the venue."},
      {r:"GROUP · 2 Aug · organiser side",t:"Visibility carefully calculated and detailed in the eclipse section of the guide."}]}},

{q:"Toilets, showers and first aid?",
 k:"toilet toilets shower showers wash bathroom sanitation first aid medical doctor emergency 112 hot water clean",
 guide:{t:"<p><strong>Campsite:</strong> real showers, toilets and a dishwashing area, plus a shaded picnic area.</p><p><strong>Festival grounds:</strong> toilets next to the Pool Stage, in the circus tent, and inside the workshop space. Outdoor showers next to the pool. Showers are hot.</p><p><strong>First aid:</strong> a kit is in Production, next to the campground. Bring your own supplies for what you or your family might need.</p><p>Emergency number in Spain is <strong>112</strong>.</p>",
   c:[{r:"GUIDE · §7 Your Campsite",t:"Real showers, toilets and a dishwashing area plus a shaded picnic area."},
      {r:"GUIDE · §8 Around the Festival",t:"Toilet and shower locations listed, with the first aid kit in Production and advice to bring your own supplies."},
      {r:"GUIDE · §13 Health & Safety",t:"Emergency number in Spain given as 112, alongside heat exhaustion and heat stroke guidance."}]},
 chat:null},

{q:"Is there phone signal or wifi? Can I charge my phone?",
 k:"signal phone reception wifi internet charge charging plug outlet work coworking laptop remote connectivity",
 guide:{t:"<p><strong>Yes to both</strong>, with caveats. It's countryside, so calls can be spotty in the campground. All buildings on site have wifi.</p><p>Charging points are inside the workshop space, and there are outlets in a few other places — ask at Production. Label your phone with your name and ID number so it can be kept safe.</p><p>The indoor dining room has tables, AC and good wifi for coworking. Bring headphones and keep the volume down.</p>",
   c:[{r:"GUIDE · §15 FAQ",t:"Phone reception exists but can be spotty in the campground; all buildings have wifi; charging outlets exist in a few places with Production as the fallback."},
      {r:"GUIDE · §8 Around the Festival",t:"Indoor dining room has tables in the AC and good wifi for coworking, kept quieter, with charging points inside the workshop space."}]},
 chat:{t:"<p>The coworking area was confirmed in the group as the indoor dining room with AC.</p>",
   c:[{r:"GROUP · 30 Jul · organiser",t:"Indoor dining room has tables and will be the coworking area, with air conditioning."}]}},

{q:"Can I bring my dog?",
 k:"dog dogs pet pets animal cat assistance service sitter kennel",
 guide:{t:"<p><strong>No. Pets are not permitted anywhere on site, including the campsite.</strong></p><p>The venue is home to dogs, cats, horses, a pony, chickens, guinea pigs, swans and ducks — unfamiliar animals cause stress for the residents and other guests.</p><p>If you rely on a certified assistance dog, contact the production team before arriving.</p>",

   c:[{r:"GROUP · 13 Jun · participant — unanswered",t:"Request for dog sitter or hostel recommendations near the venue received no reply."}]}},

{q:"Can I cook at my camp?",
 k:"cook cooking stove gas electric camping kitchen kettle hot plate bbq barbecue noodles wildfire fire extinguisher",
 conflict:"The handbook recommends a device most people have nowhere to plug in.",
 guide:{t:"<p>Outside food is welcome in the campground. Bring your own stove, cookware, utensils, plates and cups.</p><p><strong>The communal BBQ is cancelled</strong> because of regional fire Red Alerts. A gas cooker requires you to bring a fire extinguisher. <strong>An electric hot plate is recommended instead.</strong></p><p>Open-fire BBQs and charcoal grills are on the do-not-bring list.</p>",
   c:[{r:"GUIDE · §7 Your Campsite — Cooking",t:"Communal BBQ unavailable due to regional fire Red Alerts; gas cookers require a fire extinguisher; an electric hot plate is recommended instead; outside food welcome with your own equipment."},
      {r:"GUIDE · §14 Fire Safety",t:"Anyone using an open-flame gas stove must bring a fire extinguisher."}]},
 chat:{t:"<p><strong>Where to plug in that hot plate is unresolved.</strong> Power only exists on glamping and electricity plots — and those are now sold out.</p><p>Asked three times. On 5 August the organiser called it an excellent question going on the list of problems to solve, guessing at cables run to the camping picnic area.</p><p>Don't buy a hot plate on the strength of Section 7 without checking.</p>",
   c:[{r:"GROUP · 5 Aug · organiser — unresolved",t:"Access to plugs for electric stoves in general camping acknowledged as an open problem, with a guess about cables in the camping picnic area."},
      {r:"GROUP · 5 Aug · organiser",t:"Electricity camping is now full and the generator will not allow for more users."}]}},

{q:"Is there electricity?",
 k:"electricity power socket plug hookup cable adapter cee schuko generator glamping van extension",
 conflict:"The handbook still sells a pass that is no longer available.",
 guide:{t:"<p>Section 7 lists a <strong>Vehicle Parking with Electricity Pass at €60</strong> — a 30m² plot with standard two-prong European power points. Glamping also has an electricity connection; bring a long extension cord to reach your tent.</p><p>Generators require advance notice to production for placement, and a fire extinguisher.</p>",
   stale:"Electricity plots sold out on 5 August.",
   c:[{r:"GUIDE · §7 Your Campsite — Pitches & Pricing",t:"Vehicle Parking with Electricity Pass at 60 euro for a 30m2 plot with standard two-prong European power points; glamping has electricity with a long extension cord advised."}]},

   c:[{r:"GROUP · 5 Aug · organiser",t:"Electricity camping is now full and the generator will not allow for more users."},
      {r:"GROUP · 31 Jul · participant",t:"Outdoor sockets are typically CEE single phase while house sockets are Schuko, requiring an adapter."}]}},

{q:"Are camping spots assigned? How big?",
 k:"camping spot assigned reserve plot pitch tent friends together placement allocation first come serve size 30m2 price",
 guide:{t:"<p>Section 7 prices a <strong>Vehicle Parking Pass at €40</strong> — a 30m² plot suitable for two vehicles, or one vehicle plus several tents. With electricity it's €60.</p><p>Glamping is a five-night stay for groups of 2–6, or an individual bed in a six-person dorm tent, furnished with rugs, solar lights and beds with sheets and pillows.</p><p>The campground is a separate zone from the festival grounds and needs a camping bracelet to enter.</p>",
   c:[{r:"GUIDE · §7 Your Campsite — Pitches & Pricing",t:"Vehicle Parking Pass at 40 euro for a 30m2 plot suitable for two vehicles or one vehicle plus several tents; glamping described as a five-night stay for groups of 2-6 or a dorm bed."}]},
 chat:{t:"<p><strong>First come, first served — placement is not assigned.</strong> There are more than enough spots.</p><p>Free camping is an open area for tents: park in the car area, carry your gear over, pitch where you like. To camp with friends, ask them to hold space until you arrive.</p><p>One wrinkle: the plot was given as 30m² on 30 July and 20×30 on 5 August. The handbook says 30m², so go with that.</p>",
   c:[{r:"GROUP · 5 Aug · organiser",t:"Placement is not assigned as there are more than enough spots; camp with friends by asking them to save space."},
      {r:"GROUP · 30 Jul · organiser",t:"Individual reservations dropped because numbers grew too large."}]}},

{q:"Is there shade? Can I hang a hammock?",

   c:[{r:"GUIDE · §3 Packing — Camping",t:"Shade structure or tarp listed, with a note that natural shade at the campsite is limited and a shared structure is worth considering."},
      {r:"GUIDE · §4 Venue Rules",t:"Hammocks are not allowed and will be taken down anywhere in the festival grounds and campsite."}]},

   c:[{r:"GROUP · 29 Jul · organiser",t:"The venue owner is strict about hammocks, though a freestanding stand is acceptable and he will only remove them from his trees."},

{q:"How do I get there?",
 k:"address gate location coordinates gps maps aldea entrance where venue barcelona bus hife train travel transport airport rideshare drive",
 guide:{t:"<p><strong>Masia Pla dels Catalans, Carr. Tortosa, Km 11, L'Aldea, Tarragona.</strong> Gate GPS: 40.754920, 0.596966.</p><p><strong>Driving:</strong> about 2 hours from Barcelona via the AP-7, right at the L'Aldea exit roundabout. Free parking on site.</p><p><strong>Bus:</strong> Hife from Numancia 149–165–167 in Barcelona, next to L'Illa Diagonal, to Aldea Intercambiador — a 5-minute walk. From the airport, T1 Level 0 Platforms 7–12, follow \"Intercity Buses\", change at Gavà Mar. Search stops for \"Tortosa\", not \"L'Aldea\".</p><p><strong>Train:</strong> Renfe to L'Aldea-Amposta-Tortosa. <em>It is not possible to walk from the train station.</em> Take the bus or arrange a ride.</p><p>Buy transport tickets as soon as possible — they will sell out.</p>",
   c:[{r:"GUIDE · §5 Getting Here",t:"Full address, gate GPS coordinates, driving route via the AP-7, detailed Hife bus directions including the airport connection and the tip to search for Tortosa rather than L'Aldea, and a warning that walking from the train station is not possible."}]},
 chat:{t:"<p>Walking in from the bus stop, per the organiser: cross to the centre of the roundabout, cross again at Via Servei, follow the quiet road, take the first right, and continue round to the gate. About the length of a walk to a metro station.</p><p>There is a separate Ride Share group with a spreadsheet in its description.</p>",
   c:[{r:"GROUP · 5 Aug · organiser",t:"Step-by-step walking directions from the bus stop through the roundabout and Via Servei crossing to the gate, described as similar to a walk to a metro station."},
      {r:"GROUP · 2 Aug · participant",t:"Photo of the correct Hife stop, noting three Barcelona stops plus airport and advising advance purchase."}]}},

{q:"When does the gate open? Can I arrive early?",
 k:"gate open arrive early monday sunday 9th 10th build check in first day when opening hours late eclipse day traffic",
 guide:{t:"<p><strong>The event opens at 08:00 on Monday 10 August</strong> and stays open throughout.</p><p><strong>Exception: the gate is closed 19:00–20:45 on Wednesday 12 August, during the eclipse. No one is allowed in during that window.</strong></p><p>Wednesday is expected to be one of the busiest traffic days in the region — the AP-7 and N-340 will be congested from early. Leave as early as you can.</p><p>At the gate, have your ID and ticket ready for security.</p>",
   c:[{r:"GUIDE · §5 Getting Here",t:"Event opens at 08:00 on Monday 10 August and remains open throughout, with the gate closed from 19:00 to 20:45 on Wednesday 12 August during the eclipse."},
      {r:"GUIDE · §2 Before You Travel",t:"Wednesday 12 August expected to be one of the busiest traffic days in the region with severe congestion on the AP-7 and N-340."}]},
 chat:{t:"<p>Arriving Sunday the 9th is possible if the organisers know in advance — but there's no security, catering or bar that night, so come fully self-sufficient.</p><p>The grounds open at 16:00 Monday. Before that the Nido, pool and air-conditioned restaurant side are open, with arts and crafts from 12:00.</p>",
   c:[{r:"GROUP · 29 Jul · organiser",t:"Arriving the night before is fine if they know, but security, catering and the bar do not start until Monday."},
      {r:"GROUP · 5 Aug · organiser",t:"Nido, pool and air-conditioned restaurant side open before the grounds open at 16h, with crafts from 12."}]}},

{q:"What food is available?",
 k:"food eat catering meal plan breakfast lunch dinner bar drinks alcohol grocery shop supermarket vegetarian vegan gluten celiac allergy",

const SYN={van:"vehicle camper",loo:"toilet",wc:"toilet",bog:"toilet",kid:"kids children",
 aircon:"ac air conditioning",eyes:"eye glasses safety",blind:"eye safety glasses",
 wifi:"signal internet",bus:"travel barcelona",hot:"shade heat",dog:"dogs pet",
 loud:"music noise sleep",booze:"bar drinks alcohol",toilets:"toilet",showers:"shower",
 charge:"charging electricity power socket",plug:"electricity socket power",
 arrive:"arrival gate open",bins:"rubbish waste recycling",bin:"rubbish waste",
 sunburn:"heat sunscreen",boat:"pool swimming",eat:"food catering",drink:"water bar"};

const out=document.getElementById("out"), box=document.getElementById("q");

function score(it,terms){
  const q=it.q.toLowerCase(), k=it.k.toLowerCase();
  const body=[it.guide,it.chat,it.none].filter(Boolean)
    .map(s=>s.t).join(" ").replace(/<[^>]+>/g," ").toLowerCase();
  let s=0;
  terms.forEach(t=>{
    if(t.length<2)return;
    if(k.split(/\s+/).includes(t))s+=10;
    else if(q.includes(t))s+=8;
    else if(k.includes(t))s+=5;
    else if(body.includes(t))s+=2;
    else if(t.length>4&&(k+q).includes(t.slice(0,t.length-2)))s+=3;
  });
  return s;
}

function section(cls,label,s){
  if(!s)return"";
  return `<div class="from"><span class="lbl ${cls}">${label}</span>${s.t}
    ${s.stale?`<div class="note"><b>Out of date</b>${s.stale}</div>`:""}
    <ul class="srcs">${s.c.map(c=>`<li><span class="ref">${c.r}</span>${c.t}</li>`).join("")}</ul></div>`;
}

function show(it){
  return `<div class="block"><h2 class="qh">${it.q}</h2>
    ${it.conflict?`<div class="flag"><b>The two sources disagree</b>${it.conflict}</div>`:""}
    ${section("l-guide","From the handbook",it.guide)}
    ${!it.guide&&!it.none?`<div class="from"><span class="lbl l-guide">From the handbook</span>
      <p class="silent">The handbook doesn't cover this.</p></div>`:""}
    ${section("l-chat","From the group",it.chat)}
    ${!it.chat&&!it.none?`<div class="from"><span class="lbl l-chat">From the group</span>
      <p class="silent">Nobody has asked this in the chat.</p></div>`:""}
    ${section("l-none","Neither source",it.none)}
  </div>`;
}

function suggestions(exclude){
  const ex=new Set((exclude||[]).map(i=>i.q));
  const picks=DB.filter(i=>!ex.has(i.q)).slice(0,7);
  return `<div class="more"><p>${exclude?"Other questions":"People have asked"}</p>
    ${picks.map(i=>`<button data-q="${i.q.replace(/"/g,"&quot;")}">${i.q}</button>`).join("")}</div>`;
}

function render(){
  const raw=box.value.trim().toLowerCase();
  if(!raw){out.innerHTML=suggestions();return;}
  let terms=raw.split(/[^a-z0-9à-ÿ]+/).filter(Boolean);
  terms=terms.flatMap(t=>SYN[t]?[t,...SYN[t].split(" ")]:[t]);
  const hits=DB.map(i=>({i,s:score(i,terms)})).filter(x=>x.s>=5)
    .sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.i);
  if(!hits.length){
    out.innerHTML=`<div class="empty"><b>Nothing on file for that.</b>
      This only knows what the Festival Handbook and the participants chat have said.
      Ask in the group — then it becomes an answer here.</div>`+suggestions();
    return;
  }
  out.innerHTML=hits.map(show).join("")+suggestions(hits);
}

out.addEventListener("click",e=>{
  const b=e.target.closest("button[data-q]");
  if(!b)return;
  box.value=b.dataset.q;render();window.scrollTo({top:0,behavior:"smooth"});
});
box.addEventListener("input",render);
render();

if("serviceWorker"in navigator){
  const sw=`self.addEventListener("install",e=>{self.skipWaiting();
    e.waitUntil(caches.open("so3").then(c=>c.add("./")))});
    self.addEventListener("activate",e=>{e.waitUntil(caches.keys()
      .then(k=>Promise.all(k.filter(n=>n!=="so3").map(n=>caches.delete(n)))))});
    self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request)
      .then(r=>r||fetch(e.request).then(x=>{const cl=x.clone();
        caches.open("so3").then(c=>c.put(e.request,cl));return x;})
      .catch(()=>caches.match("./"))))});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))).catch(()=>{});
}
